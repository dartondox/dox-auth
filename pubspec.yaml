name: dox_auth
description: Authentication package for dox framework with session, JWT and access token drivers.
version: 3.0.2
repository: https://github.com/dartondox/dox-auth
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  bcrypt: ^1.2.0
  crypto: ^3.0.8
  dart_jsonwebtoken: ^3.4.1
  dox_annotation: ^3.0.0
  dox_core: ^3.0.1
  dox_orm: ^3.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here
# (`dox auth:tokens-table`).
dox:
  commands: package:dox_auth/commands.dart
